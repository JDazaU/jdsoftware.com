<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JD-Software | CRM a la medida para call centers</title>
<meta name="description" content="Diagnóstico en línea para diseñar un CRM propio para su call center: datos bajo su control y entregas por fases.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230B1722'/%3E%3Cg fill='%234FD1DD'%3E%3Crect x='6' y='13' width='3' height='6' rx='1.5'/%3E%3Crect x='11' y='8' width='3' height='16' rx='1.5'/%3E%3Crect x='16' y='11' width='3' height='10' rx='1.5'/%3E%3Crect x='21' y='5' width='3' height='22' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#0F2230; --muted:#566978; --line:#D3DBE1;
  --accent:#0B7285; --accent-ink:#FFFFFF; --tint:rgba(11,114,133,.10); --off:#E4EAEE;
  --body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans","Arial Narrow","Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.3,1.4,.5,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1722; --surface:#11212E; --ink:#E4ECF1; --muted:#8FA3B1; --line:#22384A;
    --accent:#4FD1DD; --accent-ink:#06212A; --tint:rgba(79,209,221,.13); --off:#1A2D3C;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1722; --surface:#11212E; --ink:#E4ECF1; --muted:#8FA3B1; --line:#22384A;
  --accent:#4FD1DD; --accent-ink:#06212A; --tint:rgba(79,209,221,.13); --off:#1A2D3C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 96px);-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.wrap.n{max-width:760px}
h1,h2,h3{font-family:var(--cond);font-weight:600;line-height:1.1;margin:0;letter-spacing:-.005em}
h1:focus,h2:focus{outline:none}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
@supports (backdrop-filter:blur(8px)){.top{background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px)}}
.top::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:env(safe-area-inset-top,0px);background:var(--bg)}
.pbar{position:absolute;left:0;top:0;width:100%;height:3px;background:var(--accent);transform-origin:0 50%;transform:scaleX(var(--p,0));transition:transform .7s var(--ease)}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:58px}
.brand{display:inline-flex;align-items:center;gap:9px;background:none;border:0;padding:6px 0;font-family:var(--cond);font-size:19px;letter-spacing:.01em}
.brand svg{width:18px;height:18px;flex:none}
.brand svg rect{fill:var(--accent);transform-origin:50% 50%;transform-box:fill-box}
.brand:hover svg rect{animation:beat .7s var(--ease)}
.brand:hover svg rect:nth-child(2){animation-delay:.06s}.brand:hover svg rect:nth-child(3){animation-delay:.12s}.brand:hover svg rect:nth-child(4){animation-delay:.18s}
@keyframes beat{40%{transform:scaleY(.35)}}
.brand i{font-style:normal;white-space:nowrap}
.brand b{font-weight:600}
.brand i span{font-weight:500;color:var(--muted)}
.pct{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.pct b{font-family:var(--cond);font-size:19px;font-weight:600;color:var(--ink)}
.wave{display:flex;gap:6px;padding:0 0 4px}
.grp{display:flex;align-items:center;gap:1px;height:38px;min-width:0;background:none;border:0;padding:0;border-radius:3px}
.bar{flex:1 1 0;min-width:1px;height:2px;background:var(--line);border-radius:1px;transition:height .32s var(--spring),background-color .2s}
.grp.cur .bar{background:var(--muted)}
.grp:hover .bar{background:var(--muted)}
.bar.on,.grp.cur .bar.on,.grp:hover .bar.on{height:var(--h);background:var(--accent)}
body[data-mode="home"] .wave,body[data-mode="home"] .nav{display:none}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 20px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:15px;text-decoration:none;transition:transform .15s var(--ease),background-color .2s,border-color .2s,box-shadow .25s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{box-shadow:0 0 0 4px var(--tint)}
.btn.big{min-height:54px;padding:12px 26px;font-size:16px}
.btn.sm{min-height:40px;padding:6px 14px;font-size:14px}
.btn.quiet{background:none;border-color:transparent;color:var(--muted);padding-left:0;padding-right:0;text-decoration:underline;text-underline-offset:3px}
.btn:focus-visible,.brand:focus-visible,.grp:focus-visible,.index button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Portada */
.hero{padding:clamp(32px,7vh,72px) 0 0}
.hero h1{font-size:clamp(44px,10.5vw,92px);line-height:.96;letter-spacing:-.015em}
.ln{display:block;overflow:hidden;padding-bottom:.06em}
.ln>span{display:block;animation:up 1s var(--ease) both;animation-delay:calc(var(--i)*120ms)}
@keyframes up{from{transform:translateY(112%)}}
.late{animation:fade .9s ease both;animation-delay:.5s}
@keyframes fade{from{opacity:0}}
.lead{font-size:clamp(17px,2vw,20px);max-width:56ch;margin:26px 0 0}
.cta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;margin-top:30px}
.hw{display:block;width:100%;height:clamp(120px,22vh,200px);margin-top:clamp(16px,3vh,36px)}
.band{padding:clamp(56px,10vh,116px) 0;border-top:1px solid var(--line)}
.band h2{font-size:clamp(30px,4.8vw,48px);max-width:20ch}
.band .intro{max-width:58ch;margin:16px 0 0;color:var(--muted);font-size:17px}
.trio{display:grid;grid-template-columns:1fr;margin-top:clamp(28px,5vh,52px)}
.trio>div{padding:22px 0;border-top:1px solid var(--line)}
.trio h3{font-size:23px}
.trio p{margin:10px 0 0;color:var(--muted);max-width:44ch}
.demo{display:grid;grid-template-columns:1fr;gap:16px;margin-top:clamp(28px,5vh,52px)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.card-h h3{font-size:20px}
.card-h span{font-size:13px;color:var(--muted)}
.ficha{margin:0}
.ficha>div{display:grid;grid-template-columns:8.5em 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ficha dt{font-size:14px;color:var(--muted)}
.ficha dd{margin:0;font-weight:500;font-variant-numeric:tabular-nums}
.mask{display:inline-block;letter-spacing:.04em;transition:color .3s}
.mask.open{color:var(--accent)}
.timer{height:2px;margin-top:6px;background:var(--accent);transform-origin:0 50%;transform:scaleX(0)}
.timer.run{animation:drain 6s linear both}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.demo-act{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.nope{animation:nope .4s var(--ease)}
@keyframes nope{25%{transform:translateX(-5px)}60%{transform:translateX(4px)}}
.log{list-style:none;margin:0;padding:0;font-size:14px}
.log li{display:grid;grid-template-columns:5.4em 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);animation:login .5s var(--ease) both}
.log time{color:var(--muted);font-variant-numeric:tabular-nums}
.log .bad{color:var(--accent);font-weight:500}
@keyframes login{from{opacity:0;transform:translateY(-8px)}}
.steps{list-style:none;margin:clamp(28px,5vh,52px) 0 0;padding:0;display:grid;grid-template-columns:1fr;counter-reset:s}
.steps li{counter-increment:s;padding:20px 0 22px;border-top:1px solid var(--line)}
.steps li::before{content:"0" counter(s);display:block;font-family:var(--cond);font-weight:500;font-size:34px;line-height:1;color:var(--accent);margin-bottom:12px}
.steps h3{font-size:21px}
.steps p{margin:8px 0 0;color:var(--muted);max-width:40ch}
.foot{border-top:1px solid var(--line);padding:28px 0 44px;font-size:14px;color:var(--muted)}
.foot b{font-family:var(--cond);font-weight:600;font-size:16px;color:var(--ink)}
@media (min-width:820px){
  .trio{grid-template-columns:repeat(3,1fr)}
  .trio>div{padding:26px 28px 6px 0;border-top:1px solid var(--line)}
  .trio>div+div{padding-left:28px;border-left:1px solid var(--line)}
  .demo{grid-template-columns:1.1fr .9fr;align-items:start}
  .steps{grid-template-columns:repeat(4,1fr)}
  .steps li{padding-right:28px}
}
.rv{opacity:0;transform:translateY(18px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:calc(var(--i,0)*90ms)}
.rv.in{opacity:1;transform:none}

/* Índice */
.index{list-style:none;margin:28px 0 0;padding:0;border-top:1px solid var(--line)}
.index button{display:grid;grid-template-columns:2.4em 1fr auto;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:15px 0;min-height:50px;transition:padding .3s var(--ease),background-color .2s}
.index button:hover{padding-left:10px;background:var(--tint)}
.index .n{font-family:var(--cond);font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums}
.index .c{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-right:6px}
.note{font-size:14px;color:var(--muted);max-width:62ch;margin:14px 0 0}

/* Formulario */
main{min-height:60vh}
#view{transition:opacity .17s ease,transform .17s ease}
#view.leave{opacity:0;transform:translateX(calc(var(--dir,1)*-18px))}
#view.enter .stag{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*38ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.form{padding:30px 0 132px}
.sec-head{display:grid;grid-template-columns:auto 1fr;column-gap:16px;align-items:end}
.sec-num{font-family:var(--cond);font-weight:500;font-size:68px;line-height:.82;color:var(--accent);font-variant-numeric:tabular-nums}
.sec-head h2{font-size:clamp(26px,5.6vw,36px)}
.sec-meta{font-size:13px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.purpose{max-width:60ch;margin:18px 0 0;color:var(--muted)}
.q{margin:32px 0 0;border:0;padding:0;min-width:0}
.ql{display:block;font-weight:500;padding:0;margin:0 0 4px;max-width:62ch}
.qh{font-size:14px;color:var(--muted);margin:0 0 10px;max-width:62ch}
.ql + .field,.ql + .opts,.ql + .rows{margin-top:10px}
.field{display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;font-size:16px;transition:border-color .2s,box-shadow .25s}
textarea.field{resize:vertical;min-height:92px}
.field::placeholder{color:var(--muted);opacity:.75}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--tint)}
.other{margin-top:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative;display:block}
.opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.opt span{display:flex;align-items:center;gap:9px;min-height:44px;padding:9px 13px;background:var(--surface);border:1px solid var(--line);border-radius:6px;font-size:15px;line-height:1.3;transition:border-color .2s,background-color .2s,transform .15s var(--ease)}
.opt span::before{content:"";flex:none;width:12px;height:12px;border:1.5px solid var(--muted);border-radius:2px;transition:background-color .2s,border-color .2s,transform .3s var(--spring)}
.opt input[type=radio] + span::before{border-radius:50%}
.opt:hover span{border-color:var(--muted)}
.opt:active span{transform:scale(.97)}
.opt input:checked + span{border-color:var(--accent);background:var(--tint)}
.opt input:checked + span::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--surface);transform:scale(1.15)}
.opt input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.rows{border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.row-name{font-size:15px}
.seg{display:grid;grid-template-columns:1.25fr 1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg label{position:relative;display:block}
.seg label + label span{border-left:1px solid var(--line)}
.seg input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.seg span{display:flex;align-items:center;justify-content:center;min-height:40px;padding:6px 8px;font-size:13.5px;text-align:center;color:var(--muted);transition:background-color .22s,color .22s}
.seg label:hover span{color:var(--ink)}
.seg input:checked + span{color:var(--ink);font-weight:500}
.seg input[value=I]:checked + span{background:var(--accent);color:var(--accent-ink)}
.seg input[value=D]:checked + span{background:var(--tint)}
.seg input[value=N]:checked + span{background:var(--off);text-decoration:line-through}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:-3px}
@media (min-width:680px){.row{grid-template-columns:1fr 330px;align-items:center;gap:20px}}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.nav .wrap{display:flex;gap:10px;justify-content:space-between}
.nav .btn.pri{line-height:24px;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:420px;margin-left:auto;text-align:center}

/* Resumen */
.sum h1{font-size:clamp(34px,7.4vw,54px);max-width:18ch}
.facts{display:grid;grid-template-columns:1fr;margin:28px 0 0;border-top:1px solid var(--line)}
.facts div{display:grid;grid-template-columns:minmax(0,11em) 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.facts dt{color:var(--muted);font-size:14px}
.facts dd{margin:0;font-weight:500}
.facts dd.na{font-weight:400;color:var(--muted)}
.sub{font-size:28px;margin-top:56px}
.phase{display:grid;grid-template-columns:1fr;gap:8px;padding:20px 0;border-top:1px solid var(--line)}
.sub + .phase{margin-top:18px}
.phase h3{font-size:21px}
.phase .k{font-size:14px;color:var(--muted);margin:4px 0 0}
.tags{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0}
.tags li{font-size:14px;padding:5px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.tags .none{border:0;background:none;padding:5px 0;color:var(--muted)}
@media (min-width:680px){.phase{grid-template-columns:210px 1fr;gap:24px}}
.notes{margin:18px 0 0;padding:0;list-style:none}
.notes li{position:relative;padding:12px 0 12px 22px;border-top:1px solid var(--line);max-width:64ch}
.notes li::before{content:"";position:absolute;left:0;top:1.25em;width:8px;height:8px;border-radius:2px;background:var(--accent)}
.meet{margin-top:56px;padding:26px 22px 24px;border:1px solid var(--accent);border-radius:10px;background:var(--surface)}
.meet h2{font-size:28px}
.meet>p{margin:10px 0 0;color:var(--muted);max-width:56ch}
.meet .q{margin-top:22px}
.two{display:grid;grid-template-columns:1fr;gap:0 16px}
@media (min-width:680px){.two{grid-template-columns:1fr 1fr}}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.status{min-height:1.5em;margin:10px 0 0;font-size:14px;color:var(--muted)}
details{margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;font-weight:500}
.out{margin-top:14px;min-height:280px;font-size:14px;line-height:1.55;white-space:pre-wrap}

/* Puntero propio (solo con ratón) */
.cur{position:fixed;left:0;top:0;z-index:100;pointer-events:none;opacity:0;transition:opacity .25s;will-change:transform}
.cur i{display:block;border-radius:50%}
.cur-dot i{width:6px;height:6px;margin:-3px;background:var(--ink);transition:transform .2s var(--ease)}
.cur-ring i{width:34px;height:34px;margin:-17px;border:1.5px solid var(--accent);transition:width .28s var(--ease),height .28s var(--ease),margin .28s var(--ease),border-radius .28s,background-color .28s,transform .2s var(--ease)}
.cur-ring.hot i{width:56px;height:56px;margin:-28px;background:var(--tint)}
.cur-ring.text i{width:3px;height:28px;margin:-14px -1.5px;border-radius:2px;border-color:transparent;background:var(--accent)}
.cur-ring.down i{transform:scale(.8)}
.cur-ring.hot + .cur-dot i,.cur-ring.text + .cur-dot i{transform:scale(0)}
html.cursor-on .cur{opacity:1}
html.cursor-on,html.cursor-on *{cursor:none!important}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rv{opacity:1;transform:none}
}
@media print{
  :root,:root[data-theme],:root:not([data-theme="light"]){--bg:#fff;--surface:#fff;--ink:#000;--muted:#444;--line:#bbb;--accent:#0B7285;--accent-ink:#fff;--tint:#eef6f7;--off:#eee}
  .top,.nav,.cur,.actions,.meet,details,.status,.noprint{display:none!important}
  .form{padding:0}
  .stag{animation:none!important}
  .phase,.facts div,.notes li{break-inside:avoid}
}
</style>
</head>

        <i><b>JD</b><span>&#8209;Software</span></i>
      </button>
      <div id="side"></div>
    </div>
    <nav class="wave" id="wave" aria-label="Avance por sección"></nav>
  </div>
</header>

<main id="view"></main>

<footer class="nav"><div class="wrap n" id="nav"></div></footer>
<div class="sr" aria-live="polite" id="live"></div>

<script>
(function(){
"use strict";

/* ─────────────────────────────────────────────────────────────
   CONFIGURACIÓN DE JD-SOFTWARE: complete antes de publicar.

var JD = { whatsapp:"573147794704", correo:"juliocesardaza@gmail.com", agenda:"", endpoint:"/api/diagnostico" };

var PRIO = [["I","Imprescindible"],["D","Deseable"],["N","No aplica"]];

var S = [
{t:"Empresa y operación", p:"Dimensiona el proyecto: número de usuarios, sedes y tipo de gestión determinan la arquitectura y el esquema de precios.", q:[

try{

  if(raw){ var d = JSON.parse(raw); if(d && typeof d.a === "object" && d.a){ A = d.a; } if(typeof d.s === "number"){ step = Math.max(-1, Math.min(SUMMARY, d.s)); } }
}catch(e){ A = {}; }

  clearTimeout(saveT);

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function txt(k){ return typeof A[k] === "string" ? A[k].trim() : ""; }
function arr(k){ return Array.isArray(A[k]) ? A[k] : []; }
function pad(n){ return (n < 10 ? "0" : "") + n; }
function find(id){ for(var i = 0; i < S.length; i++){ for(var j = 0; j < S[i].q.length; j++){ if(S[i].q[j].id === id) return S[i].q[j]; } } return null; }

function units(sec){
  var u = [];
  sec.q.forEach(function(q){
    if(q.t === "prio"){ q.items.forEach(function(_, i){ u.push(q.id + "." + i); }); } else u.push(q.id);
  });
  return u;
}
function answered(k){
  var v = A[k];
  if(Array.isArray(v)){ if(v.length) return true; }
  else if(typeof v === "string" && v.trim()) return true;
  return !!txt(k + "_otro");
}
function tally(sec){ var u = units(sec), n = 0; u.forEach(function(k){ if(answered(k)) n++; }); return [n, u.length]; }
function totals(){ var n = 0, t = 0; S.forEach(function(s){ var c = tally(s); n += c[0]; t += c[1]; }); return [n, t]; }
function firstOpen(){ for(var i = 0; i < S.length; i++){ var c = tally(S[i]); if(c[0] < c[1]) return i; } return SUMMARY; }
function label(k, q){
  var v = A[k], parts = [];
  if(Array.isArray(v)) parts = v.slice(); else if(typeof v === "string" && v.trim()) parts = [v.trim()];
  var o = txt(k + "_otro"); if(o) parts.push(o);
  return parts.join(q && q.t === "area" ? " " : ", ");
}
function prio(id, val){ var q = find(id), out = []; if(q) q.items.forEach(function(it, i){ if(A[id + "." + i] === val) out.push(it); }); return out; }

var wave = document.getElementById("wave"), view = document.getElementById("view"), nav = document.getElementById("nav"),
    side = document.getElementById("side"), pbar = document.getElementById("pbar"), live = document.getElementById("live");

/* Línea de voz: una barra por pregunta; plana si falta, con altura si está respondida */
function buildWave(){
  var h = "", g = 0;
  S.forEach(function(sec, i){
    var u = units(sec);
    h += '<button type="button" class="grp" data-go="' + i + '" style="flex:' + u.length + ' 1 0">';
    u.forEach(function(k){
      var amp = 34 + Math.round(66 * Math.abs(Math.sin(g * 1.9) * Math.cos(g * 0.53 + 1.1)));
      h += '<span class="bar" data-u="' + k + '" style="--h:' + amp + '%"></span>'; g++;
    });
    h += "</button>";
  });
  wave.innerHTML = h;
}
var lastSide = "";
function progress(){
  var bars = wave.querySelectorAll(".bar");
  for(var i = 0; i < bars.length; i++){ bars[i].classList.toggle("on", answered(bars[i].getAttribute("data-u"))); }
  var grps = wave.querySelectorAll(".grp");
  for(var j = 0; j < grps.length; j++){
    var c = tally(S[j]);
    grps[j].classList.toggle("cur", j === step);
    grps[j].setAttribute("aria-label", "Sección " + (j + 1) + ": " + S[j].t + ", " + c[0] + " de " + c[1] + " respondidas");
    if(j === step) grps[j].setAttribute("aria-current", "step"); else grps[j].removeAttribute("aria-current");
  }
  var t = totals(), p = t[1] ? t[0] / t[1] : 0, pc = Math.round(p * 100);
  pbar.style.setProperty("--p", p.toFixed(4));
  var s = step === -1
    ? '<button class="btn pri sm" type="button" data-go="' + firstOpen() + '">' + (t[0] ? "Continuar" : "Iniciar diagnóstico") + "</button>"
    : '<span class="pct" aria-label="Avance: ' + pc + ' por ciento"><b>' + pc + "</b> % completado</span>";
  if(s !== lastSide){ side.innerHTML = s; lastSide = s; }
  var m = document.getElementById("secmeta");
  if(m && step >= 0 && step < SUMMARY){ var sc = tally(S[step]); m.textContent = sc[0] + " de " + sc[1] + " respondidas"; }
}

function hero(){
  cancelAnimationFrame(heroRaf);
  var c = document.getElementById("hw"); if(!c || !c.getContext) return;
  var ctx = c.getContext("2d"), W = 0, H = 0, px = -1, hot = false, t0 = performance.now(), col = {}, frame = 0;
  function size(){ var r = c.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2); W = r.width; H = r.height; c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function colors(){ var cs = getComputedStyle(document.documentElement); col.a = cs.getPropertyValue("--accent").trim() || "#0B7285"; col.l = cs.getPropertyValue("--line").trim() || "#ccc"; col.m = cs.getPropertyValue("--muted").trim() || "#888"; }
  function draw(now){
    if(!document.body.contains(c)) return;
    if(frame++ % 40 === 0) colors();
    var t = (now - t0) / 1000, pitch = W < 600 ? 5 : 7, bw = W < 600 ? 2 : 3, n = Math.floor(W / pitch), cx = hot ? px : W * (0.5 + 0.36 * Math.sin(t * 0.45));
    ctx.clearRect(0, 0, W, H);
    for(var i = 0; i < n; i++){
      var x = i * pitch + (W - n * pitch) / 2;
      var a = Math.abs(Math.sin(i * 0.23 + t * 1.6) * Math.sin(i * 0.051 - t * 0.6)) * 0.75 + Math.abs(Math.sin(i * 0.9 + t * 2.3)) * 0.25;
      var g = Math.exp(-Math.pow((x - cx) / (W < 600 ? 70 : 130), 2));
      var h = Math.max(2, H * (0.05 + a * (0.16 + 0.74 * g)));
      ctx.fillStyle = g > 0.3 ? col.a : (g > 0.06 ? col.m : col.l);
      ctx.globalAlpha = g > 0.3 ? 1 : 0.9;
      rr(x, (H - h) / 2, bw, h, bw / 2);
    }
    ctx.globalAlpha = 1;
    if(!reduce) heroRaf = requestAnimationFrame(draw);
  }
  function rr(x, y, w, h, r){ ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); ctx.fill(); }
  c.parentNode.onpointermove = function(e){ if(e.pointerType === "mouse"){ var r = c.getBoundingClientRect(); px = e.clientX - r.left; hot = true; } };

  size(); colors(); heroRaf = requestAnimationFrame(draw);
}

    var all = view.querySelectorAll('input[type="checkbox"][name="' + t.name + '"]'), v = [];
    for(var i = 0; i < all.length; i++){ if(all[i].checked) v.push(all[i].value); }
    if(v.length) A[t.name] = v; else delete A[t.name];
    save(); progress();
  }
});
view.addEventListener("input", function(e){
  var k = e.target.getAttribute && e.target.getAttribute("data-k");
  if(!k) return;
  if(e.target.value.trim()) A[k] = e.target.value; else delete A[k];
  save(); progress();
});

/* ── Puntero propio: solo con ratón y sin preferencia de movimiento reducido ── */
(function(){
  if(reduce || !window.matchMedia || !window.matchMedia("(hover:hover) and (pointer:fine)").matches) return;
  var ring = document.querySelector(".cur-ring"), dot = document.querySelector(".cur-dot"), root = document.documentElement,
      x = 0, y = 0, rx = 0, ry = 0, on = false, raf = 0;
  function loop(){
    rx += (x - rx) * 0.2; ry += (y - ry) * 0.2;
    ring.style.transform = "translate3d(" + rx.toFixed(1) + "px," + ry.toFixed(1) + "px,0)";
    raf = (Math.abs(x - rx) + Math.abs(y - ry) > 0.2) ? requestAnimationFrame(loop) : 0;
  }
  document.addEventListener("mousemove", function(e){
    x = e.clientX; y = e.clientY;
    dot.style.transform = "translate3d(" + x + "px," + y + "px,0)";
    if(!on){ on = true; rx = x; ry = y; root.classList.add("cursor-on"); }
    if(!raf) raf = requestAnimationFrame(loop);
  }, {passive:true});
  document.addEventListener("mouseover", function(e){
    var t = e.target; if(!t.closest) return;
    var isText = !!t.closest('input[type="text"],input[type="date"],textarea');
    ring.classList.toggle("text", isText);
    ring.classList.toggle("hot", !isText && !!t.closest("a,button,label,summary"));
  });
  document.addEventListener("mousedown", function(){ ring.classList.add("down"); });
  document.addEventListener("mouseup", function(){ ring.classList.remove("down"); });
  document.documentElement.addEventListener("mouseleave", function(){ on = false; root.classList.remove("cursor-on"); });
  window.addEventListener("blur", function(){ on = false; root.classList.remove("cursor-on"); });
})();

buildWave();
render(false);

}
